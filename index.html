<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HomePilot AI</title>

  <style>
    /* All CSS goes here */

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      padding: 30px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 50px 20px;
    }

    .card {
      padding: 25px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    input,
    textarea,
    select {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <header>
    <h1>HomePilot AI</h1>
    <p>Your intelligent real estate assistant</p>
  </header>

  <main>
    <div class="card">
      <h2>Analyze a Property</h2>

      <form id="propertyForm">
        <label for="mode">I am a:</label>

        <select id="mode">
          <option value="buyer">Buyer</option>
          <option value="seller">Seller</option>
        </select>

        <label for="budget">Budget or target price</label>

        <input
          id="budget"
          type="number"
          placeholder="700000"
        >

        <label for="price">Property price</label>

        <input
          id="price"
          type="number"
          placeholder="675000"
          required
        >

        <label for="taxes">Annual property taxes</label>

        <input
          id="taxes"
          type="number"
          placeholder="13000"
        >

        <label for="bedrooms">Bedrooms</label>

        <input
          id="bedrooms"
          type="number"
          placeholder="4"
        >

        <label for="bathrooms">Bathrooms</label>

        <input
          id="bathrooms"
          type="number"
          step="0.5"
          placeholder="2.5"
        >

        <label for="goals">Your goals</label>

        <textarea
          id="goals"
          placeholder="Describe your needs, budget, deal breakers, and preferred features."
        ></textarea>

        <label for="description">Property description</label>

        <textarea
          id="description"
          placeholder="Paste the listing description and any facts you know."
          required
        ></textarea>

        <button type="submit">
          Analyze Property
        </button>
      </form>

      <div id="result">
        Your AI report will appear here.
      </div>
    </div>
  </main>

  <script>
    /*
      This is your public Cloudflare Worker URL.

      It is safe to place the Worker URL here.
      Do not place your Gemini API key here.
    */

    const API_URL = "https://homepilot-ai-api.ajashratripathi2.workers.dev/";

    const form = document.getElementById("propertyForm");
    const resultBox = document.getElementById("result");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!API_URL) {
        resultBox.textContent =
          "The AI backend is not connected yet. Add your Cloudflare Worker URL inside the API_URL variable.";
        return;
      }

      const button = form.querySelector("button");

      const propertyData = {
        mode: document.getElementById("mode").value,
        budget: document.getElementById("budget").value,
        price: document.getElementById("price").value,
        taxes: document.getElementById("taxes").value,
        bedrooms: document.getElementById("bedrooms").value,
        bathrooms: document.getElementById("bathrooms").value,
        goals: document.getElementById("goals").value,
        description: document.getElementById("description").value
      };

      button.disabled = true;
      button.textContent = "Analyzing...";

      resultBox.textContent =
        "HomePilot AI is reviewing the property.";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(propertyData)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "The analysis request failed."
          );
        }

        resultBox.textContent = marked.parse(data.report);
      } catch (error) {
        resultBox.textContent =
          "Something went wrong:\n\n" + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Analyze Property";
      }
    });
  </script>

</body>
</html>
